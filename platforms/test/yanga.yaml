platforms:
  # Execute tests with GoogleTest framework
  - name: test
    description: Build and run the components' gtest and pytest tests
    build_targets:
      generic: [report, coverage, lint]
      variant: [all]
    generators:
      - step: GTestCMakeGenerator
        module: yanga.cmake.gtest
        config:
            mocking:
              enabled: true
              strict: false
              exclude_symbol_patterns:
                - "_*"
      - step: PytestCMakeGenerator
        module: yanga.cmake.pytest
        config:
            mocking:
              strict: false
              exclude_symbol_patterns:
                - "_*"
      - step: TestResultsCMakeGenerator
        module: yanga.cmake.test_results
      #- step: CppCheckCMakeGenerator
      #  module: yanga.cmake.cppcheck
      - step: ClangTidyCMakeGenerator
        module: yanga.cmake.clang_tidy
      - step: SphinxTestReportCMakeGenerator
        module: yanga.cmake.sphinx_test_report
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
        config:
            source_links: true
            resolvers:
              default: [gcovr]
              local: [gcovr, vscode]
              ci: [gcovr, repository]
    configs:
      - id: west
        content:
          manifest:
            remotes:
              - name: gtest
                url-base: https://github.com/google
            projects:
              - name: googletest
                remote: gtest
                revision: v1.17.0
                path: gtest
      - id: poks
        file: platforms/test/poks.json
      - id: toolchain
        file: "platforms/test/gcc.cmake"
